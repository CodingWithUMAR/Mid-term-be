<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Umar Auth</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="shell"><section class="panel">
<a class="brand" href="/">UM<span>.</span></a><p class="eyebrow">SECURE YOUR ACCOUNT</p><h1>Reset password</h1>
<p class="muted">Enter the reset code sent to your email and choose a new password.</p>
<form id="reset-form">
<label for="email">Email address</label><input id="email" name="email" type="email" required>
<label for="otp">Six-digit reset code</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
<label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
<button type="submit">Reset password</button></form>
<p id="message" class="message" role="status" aria-live="polite"></p><p class="switch"><a href="/forgot.html">Request another code</a></p>
</section></main></body></html>
