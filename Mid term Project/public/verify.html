<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify email | Umar Auth</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="shell"><section class="panel">
<a class="brand" href="/">UM<span>.</span></a><p class="eyebrow">EMAIL VERIFICATION</p><h1>Enter your code</h1>
<p class="muted">Enter the six-digit code sent to your email. It expires after 10 minutes.</p>
<form id="verify-form"><label for="email">Email address</label><input id="email" name="email" type="email" required>
<label for="otp">Six-digit code</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
<button type="submit">Verify email</button></form>
<button id="resend-verify" class="secondary" type="button">Resend code</button>
<p id="message" class="message" role="status" aria-live="polite"></p><p class="switch"><a href="/login.html">Back to sign in</a></p>
</section></main></body></html>
