<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | Umar Auth</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="shell"><section class="panel">
<a class="brand" href="/">UM<span>.</span></a><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Forgot password?</h1>
<p class="muted">Enter your account email. If eligible, we will send a reset code.</p>
<form id="forgot-form"><label for="email">Email address</label><input id="email" name="email" type="email" required><button type="submit">Send reset code</button></form>
<p id="message" class="message" role="status" aria-live="polite"></p><p class="switch"><a href="/reset.html">I already have a reset code</a></p><p class="switch"><a href="/login.html">Back to sign in</a></p>
</section></main></body></html>
