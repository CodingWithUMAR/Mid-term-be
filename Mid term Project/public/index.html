<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Umar Auth</title><link rel="stylesheet" href="/styles.css">
  <script src="/auth.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <a class="brand" href="/">UM<span>.</span></a>
      <p class="eyebrow">GET STARTED</p><h1>Create your account</h1>
      <p class="muted">Create an account and verify your email to continue.</p>
      <form id="signup-form">
        <label for="name">Full name</label><input id="name" name="name" autocomplete="name" minlength="2" maxlength="80" required>
        <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <p class="hint">Use at least 8 characters. A password manager is recommended.</p>
        <button type="submit">Create account</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="switch">Already registered? <a href="/login.html">Sign in</a></p>
    </section>
  </main>
</body></html>
