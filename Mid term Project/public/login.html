<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Umar Auth</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="shell"><section class="panel">
<a class="brand" href="/">UM<span>.</span></a><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>
<p class="muted">Use your verified email address and password.</p>
<form id="login-form">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form>
<p id="message" class="message" role="status" aria-live="polite"></p>
<p class="switch"><a href="/forgot.html">Forgot password?</a></p><p class="switch">New here? <a href="/">Create account</a></p>
</section></main></body></html>
